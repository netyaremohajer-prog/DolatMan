name: Windows WPF build

on:
  push:
    branches:
      - main
      - fix/visible-chrome-and-repo-cleanup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Remove stale generated files
        shell: pwsh
        run: |
          if (Test-Path "DolatMan_FullProject/obj") { Remove-Item "DolatMan_FullProject/obj" -Recurse -Force }
          if (Test-Path "DolatMan_FullProject/bin") { Remove-Item "DolatMan_FullProject/bin" -Recurse -Force }

      - name: Restore
        run: dotnet restore DolatMan_FullProject/DolatMan.csproj

      - name: Build WPF app
        run: dotnet build DolatMan_FullProject/DolatMan.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish DolatMan_FullProject/DolatMan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = "DolatMan_FullProject/bin/Release/net10.0-windows/win-x64/publish/DolatMan.exe"
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          Get-Item $exe | Format-List FullName,Length
