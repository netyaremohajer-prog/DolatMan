name: Windows build

on:
  push:
    branches: [ main, fix/visible-chrome-and-repo-cleanup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DolatMan_FullProject/DolatMan.csproj
      - name: Build
        run: dotnet build DolatMan_FullProject/DolatMan.csproj -c Release --no-restore
